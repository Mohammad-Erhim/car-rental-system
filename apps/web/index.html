<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/api/v1/meta/icon.svg" />
    <!-- Published brand tokens, render-blocking → no brand flash on first load (DEC-025).
         The ThemeProvider still applies live updates without a reload. -->
    <link rel="stylesheet" href="/api/v1/meta/branding.css" />
    <title>Operations Console</title>
    <meta name="description" content="Car Rental operations & admin dashboard." />
    <script>
      /* Light/dark + density before first paint. The brand *colours* come from the
         render-blocking branding.css <link> above; the ThemeProvider then keeps everything
         live without a reload. Safe if storage is unavailable. */
      (function () {
        try {
          var t = localStorage.getItem('carrental.theme') || 'system';
          var dark =
            t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          var r = document.documentElement;
          r.classList.toggle('dark', dark);
          r.style.colorScheme = dark ? 'dark' : 'light';
          var b = localStorage.getItem('carrental.brand.v1');
          if (b) {
            var cfg = JSON.parse(b);
            if (cfg && cfg.density) r.dataset.density = cfg.density;
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
