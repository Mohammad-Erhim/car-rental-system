# Admin/observability edge (compose.admin.yaml) — one port per tool, HTTP Basic Auth on all of
# them (deploy/admin.htpasswd, see ADMIN-RUNBOOK.md), root-path proxying so Portainer's client
# routing (which assumes it owns the whole origin) works without subpath rewriting.
#
# Every location clears the Authorization header before proxying (verified necessary: Grafana
# treats ANY inbound Authorization: Basic header as its own login attempt, regardless of which
# realm it was meant for. Left unstripped, a browser that cached the nginx Basic Auth prompt
# resends that header on every request, Grafana logs each one as a *failed* admin login, and its
# brute-force protection locks the real admin out after a handful of ordinary page loads — with
# nobody ever mistyping anything at Grafana's own login form). This nginx layer and each app's own
# login are two separate, unrelated credential stores; the header must not leak between them.
#
# Timeouts are longer than the main deploy/nginx.edge.conf on purpose: this stack shares the host
# with the app and may be swapping under memory pressure (RUNBOOK "swap"), so a slow first
# response from Grafana/Portainer should not read as a proxy error.

log_format admin_access '$remote_addr - $remote_user [$time_local] "$request" $status';

server {
  listen 8091;
  server_name _;
  auth_basic 'car-rental-system admin';
  auth_basic_user_file /etc/nginx/admin.htpasswd;
  access_log /dev/stdout admin_access;

  location / {
    proxy_pass http://portainer:9000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization "";
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }
}

server {
  listen 8092;
  server_name _;
  auth_basic 'car-rental-system admin';
  auth_basic_user_file /etc/nginx/admin.htpasswd;
