# Scrape targets for the admin/observability stack (compose.admin.yaml). Internal-network only —
# Prometheus reaches these by their compose service name, never through admin-edge.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: carrental-api
    metrics_path: /metrics
    static_configs:
      - targets: ['api:3001']
    # If you set METRICS_TOKEN in .env (deploy/RUNBOOK.md), the api requires it on every /metrics
    # request via the X-Metrics-Token header. Prometheus config has no env-var interpolation, so
    # add it here directly (this file is tracked — do not commit a real token):
    #   headers:
    #     X-Metrics-Token: ['paste-the-same-value-as-METRICS_TOKEN']
    # (needs Prometheus 2.51+; if your pinned version predates that, leave METRICS_TOKEN unset —
    # this scrape path never leaves the docker network, so the token is defense in depth, not the
    # only control.)

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
