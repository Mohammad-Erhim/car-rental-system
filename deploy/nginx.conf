# Operations dashboard (Vite SPA, base=/ops/). Rendered by the nginx:alpine entrypoint
# (envsubst) — ${API_UPSTREAM} comes from the env. Behind the edge proxy this is reached at
# `/ops` (STAGE-011); it also serves standalone for a web-only deploy.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  absolute_redirect off; # behind the edge proxy — keep redirects relative (no :8080 leak)

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy no-referrer always;
  add_header Cross-Origin-Opener-Policy same-origin always;

  # hashed asset bundles are immutable
  location /ops/assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # API + health proxied to the API service (same-origin from the browser's view)
  location /api/ {
    proxy_pass ${API_UPSTREAM};
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }
  location /health/ {
    proxy_pass ${API_UPSTREAM};
    proxy_set_header Host $host;
  }

  # SPA fallback for the dashboard — every /ops path renders /ops/index.html
  location /ops/ {
    try_files $uri $uri/ /ops/index.html;
  }
  location = /ops {
    return 302 /ops/;
  }
  location = / {
    return 302 /ops/;
  }
}
