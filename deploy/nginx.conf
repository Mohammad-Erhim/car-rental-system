# Rendered by the nginx:alpine entrypoint (envsubst) — ${API_UPSTREAM} comes from the env.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # security headers (SRS-SEC-015 — the API sets its own; these cover the static origin)
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy no-referrer always;
  add_header Cross-Origin-Opener-Policy same-origin always;

  # hashed asset bundles are immutable
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # API + health proxied to the API service (same-origin from the browser's view)
  location /api/ {
    proxy_pass ${API_UPSTREAM};
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }
  location /health/ {
    proxy_pass ${API_UPSTREAM};
    proxy_set_header Host $host;
  }

  # SPA fallback — every other path renders index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
