# Car Rental System — full local stack (SRS §17.6). Not for production as-is: set real secrets,
# terminate TLS in front, and run Postgres/Redis as managed services.
#
#   cp .env.example .env && edit          # fill the REPLACE_ME values
#   docker compose -f deploy/docker-compose.yml up -d --build
#   docker compose -f deploy/docker-compose.yml run --rm migrate      # migrate + seed system
#   open http://localhost:3000
#
# `migrate` is a one-shot: it applies migrations and seeds the SYSTEM data only (no demo people
# or money). Run `... run --rm seed-dev` for the development fixture.

name: carrental

x-api-env: &api-env
  NODE_ENV: production
  DATABASE_URL: postgresql://carrental:${POSTGRES_PASSWORD:-carrental}@postgres:5432/carrental
  REDIS_URL: redis://redis:6379/0
  API_PORT: '3001'
  APP_URL: ${APP_URL:-http://localhost:3000}
  API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:3001}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
  PASSWORD_PEPPER: ${PASSWORD_PEPPER:?set PASSWORD_PEPPER}
  COOKIE_SECRET: ${COOKIE_SECRET:?set COOKIE_SECRET}
  OBJECT_STORAGE_SIGNING_SECRET: ${OBJECT_STORAGE_SIGNING_SECRET:-change-me-obj-signing}
  PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-change-me-pay-webhook}
  MAIL_DRIVER: outbox
  PAYMENT_DRIVER: simulator
  RATE_LIMIT_ENABLED: '1'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: carrental
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carrental}
      POSTGRES_DB: carrental
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U carrental -d carrental']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--save', '60', '1', '--appendonly', 'no']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: { context: .., dockerfile: deploy/Dockerfile.api }
    profiles: ['tools']
    environment: *api-env
    command:
      [
        'sh',
        '-lc',
        'node dist/database/migrate.js && node dist/database/seed/seed.js --profile=system',
      ]
    depends_on:
      postgres: { condition: service_healthy }

  seed-dev:
    build: { context: .., dockerfile: deploy/Dockerfile.api }
    profiles: ['tools']
    environment: *api-env
    command: ['node', 'dist/database/seed/seed.js', '--profile=development']
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: { context: .., dockerfile: deploy/Dockerfile.api }
    environment: *api-env
    ports: ['3001:3001']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  worker:
    build: { context: .., dockerfile: deploy/Dockerfile.api }
    environment: *api-env
    command: ['node', 'dist/worker.js']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  web:
    build: { context: .., dockerfile: deploy/Dockerfile.web }
    environment:
      API_UPSTREAM: http://api:3001
    ports: ['3000:8080']
    depends_on: [api]
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
