# Edge proxy for the production-shaped stack (STAGE-011). Routes by subdomain (Host header, one
# `server{}` block per hostname), so each origin's cookies/CORS/client-side routing behave the
# way each app already assumes (the ops SPA's asset paths are baked in under /ops; a mobile
# client hitting the API directly needs its own root, not a path prefix under the customer site):
#   ${SITE_DOMAIN}  -> site  (Next.js customer site)
#   ${OPS_DOMAIN}   -> web   (Vite operations dashboard; rewritten to its /ops/ build base)
#   ${API_DOMAIN}   -> api   (public API root — mobile app, or any non-browser client)
# Rendered by the nginx:alpine entrypoint (envsubst) from ${SITE_UPSTREAM} / ${WEB_UPSTREAM} /
# ${API_UPSTREAM} / ${SITE_DOMAIN} / ${OPS_DOMAIN} / ${API_DOMAIN} / ${TLS_CERT_DOMAIN}.
#
# One cookie now needs an explicit Domain (apps/api/src/modules/iam/iam.cookies.ts,
# COOKIE_DOMAIN) so the refresh/CSRF cookies survive across these three now-separate origins —
# without it a cookie set while signing in on ${OPS_DOMAIN} is host-only and invisible on
# ${SITE_DOMAIN}/${API_DOMAIN}. They stay `SameSite=Lax`: subdomains of one registrable domain
# are same-site, so this doesn't reopen the cross-site CSRF surface DEC-021 avoided by using one
# origin — swapping "one origin" for "one registrable domain, Domain-scoped cookie" keeps the
# same property while allowing three real origins.
#
# `proxy_pass` targets are variables, not literal upstream strings, on purpose (verified the
# failure mode this avoids): a bare `proxy_pass http://api:3001` resolves that hostname to a
# container IP ONCE, when this worker starts, and keeps using it — recreate just the `api`
# container (a normal partial redeploy, or manual recovery) and edge keeps proxying to the now-
# dead IP until IT is also restarted, with no error at redeploy time to explain why. A variable
# forces nginx to re-resolve through Docker's embedded DNS (127.0.0.11) on every `valid` window
# instead of caching the IP for the worker's lifetime.
resolver 127.0.0.11 valid=10s;

# Plain HTTP: redirect everything to HTTPS. The refresh/CSRF cookies (iam.cookies.ts) are
# `Secure` whenever NODE_ENV=production, so a browser silently refuses to store (or send back)
# a `Secure` cookie over plain HTTP — without this redirect a visitor lands on a session that
# can never survive a page refresh, with nothing in the app's own logs to explain why (verified
# deploying without TLS).
server {
  listen 80;
  server_name _;
  return 301 https://$host$request_uri;
}

# Shared security headers, one copy included by every HTTPS server block below.
# (A Content-Security-Policy is deliberately not set: the site/ops apps inject inline <style>
# (branding CSS) at runtime, so a correct CSP needs a nonce/hash wired through the app build,
# not a value guessed at the nginx layer.)

server {
  listen 443 ssl;
  server_name ${SITE_DOMAIN};

  ssl_certificate     /etc/letsencrypt/live/${TLS_CERT_DOMAIN}/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/${TLS_CERT_DOMAIN}/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  location /api/ {
    set $api_upstream ${API_UPSTREAM};
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }
  location /health/ {
    set $api_upstream ${API_UPSTREAM};
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
  }
  location / {
    set $site_upstream ${SITE_UPSTREAM};
    proxy_pass $site_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}

server {
  listen 443 ssl;
  server_name ${OPS_DOMAIN};

  ssl_certificate     /etc/letsencrypt/live/${TLS_CERT_DOMAIN}/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/${TLS_CERT_DOMAIN}/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  location /api/ {
    set $api_upstream ${API_UPSTREAM};
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }
  location /health/ {
    set $api_upstream ${API_UPSTREAM};
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
  }
  # The Vite SPA's own build has base=/ops/ baked in (Dockerfile.web copies its dist to
  # /usr/share/nginx/html/ops), so its asset/route references are already absolute /ops/...
  # paths — keep that working as-is, and rewrite the bare root the same way so visiting this
  # origin's "/" resolves to the app instead of a 404.
  location /ops {
    set $web_upstream ${WEB_UPSTREAM};
    proxy_pass $web_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  # A real redirect, not an internal rewrite: the SPA's own build has basename=/ops baked into
  # its client-side router (matching Vite's base=/ops/), which reads the browser's actual
  # address bar — an internal rewrite serves the right files at "/" but the browser still shows
  # "/", so the router matches nothing and renders blank (verified live). The redirect makes the
  # browser's own URL become /ops/, which the router (and every asset it then requests) expects.
  location = / {
    return 302 /ops/;
  }
}

server {
  listen 443 ssl;
  server_name ${API_DOMAIN};

  ssl_certificate     /etc/letsencrypt/live/${TLS_CERT_DOMAIN}/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/${TLS_CERT_DOMAIN}/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # The whole origin IS the API root here — a mobile client, or any direct API caller, expects
  # e.g. /v1/... at the root, not nested under /api like the browser-facing origins above.
  location / {
    set $api_upstream ${API_UPSTREAM};
    rewrite ^/(.*)$ /api/$1 break;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    # The upstream app only ever sees/generates `/api/v1/...` paths (it doesn't know this origin
    # strips that prefix), so the refresh cookie's `Path=/api/v1/auth` (iam.cookies.ts) comes back
    # scoped to a path this client never actually requests (it calls `/v1/auth/...`, not
    # `/api/v1/auth/...`) — the cookie gets stored but the native HTTP stack correctly never
    # attaches it again, silently 401ing every refresh (auth_required) regardless of restarts.
    # `rewrite ... break` only touches the request path sent upstream; it does nothing to response
    # headers, so this has to be corrected separately on the way back out.
    proxy_cookie_path /api/v1/auth /v1/auth;
  }
  location /health/ {
    set $api_upstream ${API_UPSTREAM};
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
  }
}
