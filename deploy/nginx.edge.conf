# Edge proxy for the production-shaped stack (STAGE-011): one origin for the whole system so
# the SameSite=Lax refresh cookie (DEC-021) works across the customer site and the dashboard.
#   /        -> site  (Next.js customer site)
#   /ops     -> web   (Vite operations dashboard, base=/ops/)
#   /api,/health -> api
# Rendered by the nginx:alpine entrypoint (envsubst) from ${SITE_UPSTREAM} / ${WEB_UPSTREAM} /
# ${API_UPSTREAM}.
#
# `proxy_pass` targets are variables, not literal upstream strings, on purpose (verified the
# failure mode this avoids): a bare `proxy_pass http://api:3001` resolves that hostname to a
# container IP ONCE, when this worker starts, and keeps using it — recreate just the `api`
# container (a normal partial redeploy, or manual recovery) and edge keeps proxying to the now-
# dead IP until IT is also restarted, with no error at redeploy time to explain why. A variable
# forces nginx to re-resolve through Docker's embedded DNS (127.0.0.11) on every `valid` window
# instead of caching the IP for the worker's lifetime.
resolver 127.0.0.11 valid=10s;

server {
  listen 8080;
  server_name _;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  # Only takes effect once served over HTTPS (TLS terminates in front of this container, per the
  # compose.prod.yaml note) — harmless to set unconditionally, and closes the downgrade-to-HTTP
  # window the moment TLS is actually in front. A Content-Security-Policy is deliberately not set
  # here: the site/ops apps inject inline <style> (branding CSS) at runtime, so a correct CSP
  # needs a nonce/hash wired through the app build, not a value guessed at the nginx layer.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  location /api/ {
    set $api_upstream ${API_UPSTREAM};
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }
  location /health/ {
    set $api_upstream ${API_UPSTREAM};
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
  }

  location /ops {
    set $web_upstream ${WEB_UPSTREAM};
    proxy_pass $web_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    set $site_upstream ${SITE_UPSTREAM};
    proxy_pass $site_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
