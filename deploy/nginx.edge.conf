# Edge proxy for the production-shaped stack (STAGE-011): one origin for the whole system so
# the SameSite=Lax refresh cookie (DEC-021) works across the customer site and the dashboard.
#   /        -> site  (Next.js customer site)
#   /ops     -> web   (Vite operations dashboard, base=/ops/)
#   /api,/health -> api
# Rendered by the nginx:alpine entrypoint (envsubst) from ${SITE_UPSTREAM} / ${WEB_UPSTREAM} /
# ${API_UPSTREAM}.
server {
  listen 8080;
  server_name _;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;

  location /api/ {
    proxy_pass ${API_UPSTREAM};
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }
  location /health/ {
    proxy_pass ${API_UPSTREAM};
    proxy_set_header Host $host;
  }

  location /ops {
    proxy_pass ${WEB_UPSTREAM};
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass ${SITE_UPSTREAM};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
