# Minimal single-binary Tempo, filesystem storage — the trace backend for compose.admin.yaml's
# Grafana. Only OTLP/HTTP is enabled (matches apps/api/src/tracing.ts's exporter); no other
# receiver protocol is wired up since nothing else in this stack speaks them.
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal

compactor:
  compaction:
    # 24h is plenty for an EC2 debugging platform (RUNBOOK's Loki retention is 7d, Prometheus
    # 15d) — keeps disk use bounded on a small instance without a separate housekeeping step.
    block_retention: 24h
