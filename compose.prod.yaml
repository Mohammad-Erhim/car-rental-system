# Car Rental System — PRODUCTION-shaped stack (SRS §17.6).
#
#   cp .env.example .env                       # set real POSTGRES_PASSWORD / JWT_ACCESS_SECRET /
#                                               # PASSWORD_PEPPER / COOKIE_SECRET /
#                                               # OBJECT_STORAGE_SIGNING_SECRET / PAYMENT_WEBHOOK_SECRET /
#                                               # PAYMENT_CONFIG_ENCRYPTION_KEY
#   docker compose -f compose.prod.yaml build
#   docker compose -f compose.prod.yaml up -d  # migrate + seed:system run automatically, then api/worker/web
#   docker compose -f compose.prod.yaml run --rm seed-dev   # optional demo dataset
#   open http://localhost:3000
#
# Interpolated ${VARS} are read from the repo-root `.env` (that is why this file lives at the
# repo root, not in deploy/). Not production-final as-is: terminate TLS in front, and run
# Postgres/Redis as managed services rather than containers.
#
# Development stack: compose.yaml.

name: carrental

# Bounded container logs — a stopped-then-wedged service can otherwise fill the disk.
x-logging: &logging
  logging:
    driver: json-file
    options: { max-size: '10m', max-file: '3' }

x-api-image: &api-image
  build:
    context: .
    dockerfile: deploy/Dockerfile.api
    target: runtime
    args:
      GIT_SHA: ${GIT_SHA:-}
      BUILD_TIME: ${BUILD_TIME:-}
  image: carrental-api:${TAG:-local}

x-api-env: &api-env
  NODE_ENV: production
  DATABASE_URL: postgres://carrental:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/carrental
  REDIS_URL: redis://redis:6379/0
  API_PORT: '3001'
  APP_URL: ${APP_URL:-http://localhost:3000}
  API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:3001}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET (openssl rand -base64 48)}
  PASSWORD_PEPPER: ${PASSWORD_PEPPER:?set PASSWORD_PEPPER}
  COOKIE_SECRET: ${COOKIE_SECRET:?set COOKIE_SECRET}
  OBJECT_STORAGE_SIGNING_SECRET: ${OBJECT_STORAGE_SIGNING_SECRET:?set OBJECT_STORAGE_SIGNING_SECRET}
  PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:?set PAYMENT_WEBHOOK_SECRET}
  # At-rest key for Stripe secret keys stored in payment_provider_config (secret-cipher.ts) — the
  # same tier as JWT_ACCESS_SECRET/PASSWORD_PEPPER above. Previously missing from this file
  # entirely, which meant a production deploy silently fell back to the app's dev-only default
  # and encrypted live Stripe keys with a key visible in source control.
  PAYMENT_CONFIG_ENCRYPTION_KEY: ${PAYMENT_CONFIG_ENCRYPTION_KEY:?set PAYMENT_CONFIG_ENCRYPTION_KEY (openssl rand -base64 48)}
  MAIL_DRIVER: ${MAIL_DRIVER:-outbox}
  PAYMENT_DRIVER: ${PAYMENT_DRIVER:-simulator}
  RATE_LIMIT_ENABLED: '1'
  LOG_LEVEL: ${LOG_LEVEL:-info}
  # DEC-043: unset (default) means tracing.ts never starts the OTel SDK — zero overhead unless you
  # opt in (e.g. compose.admin.yaml's tempo: http://tempo:4318/v1/traces).
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_TRACES_SAMPLE_RATIO: ${OTEL_TRACES_SAMPLE_RATIO:-0.2}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: carrental
      # Every other secret in this file (JWT_ACCESS_SECRET, PASSWORD_PEPPER, COOKIE_SECRET,
      # OBJECT_STORAGE_SIGNING_SECRET, PAYMENT_WEBHOOK_SECRET, PAYMENT_CONFIG_ENCRYPTION_KEY)
      # hard-fails when unset — this one silently defaulted to a well-known literal, which meant a
      # deploy that skipped setting it shipped production with a public username/password pair.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: carrental
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U carrental -d carrental']
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    <<: *logging

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--save', '60', '1', '--appendonly', 'no']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    <<: *logging

  # one-shot: apply migrations + seed the SYSTEM catalogues (no people, vehicles, or money).
  # Runs on every `up`; idempotent and a fast no-op once the schema is current. api/worker
  # wait for it to succeed, so a bare `up -d` boots to a working system.
  # (No `init: true` on api-image services — deploy/Dockerfile.api already runs tini as PID 1.)
  migrate:
    <<: *api-image
    environment: *api-env
    volumes: ['objectstorage:/app/var']
    command:
      [
        'sh',
        '-lc',
        'node dist/database/migrate.js && node dist/database/seed/seed.js --profile=system',
      ]
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'

  # opt-in: the development fixture (demo users, vehicles, reservations).
  #   docker compose -f compose.prod.yaml run --rm seed-dev
  seed-dev:
    <<: *api-image
    profiles: ['tools']
    environment: *api-env
    volumes: ['objectstorage:/app/var']
    command: ['node', 'dist/database/seed/seed.js', '--profile=development']
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'

  api:
    <<: [*api-image, *logging]
    environment: *api-env
    # OBJECT_STORAGE_FS_ROOT (./var/objects, DEC-015's filesystem driver — driver-license photos,
    # data-export downloads, the dev seed's vehicle photos) lived in the container's own writable
    # layer with no volume, verified the hard way: recreating this container for an unrelated fix
    # silently discarded every file under it while the database rows referencing them (imageRef,
    # stored_object) survived untouched, leaving every reference pointing at a 404.
    volumes: ['objectstorage:/app/var']
    # Loopback by default: `edge` already proxies /api + /health (DEC-021's single-origin
    # design), so nothing needs this published beyond direct debugging on the host itself.
    # ufw's default-DROP INPUT policy does NOT protect Docker's published ports (its DNAT/
    # FORWARD rules bypass the INPUT chain ufw filters — verified on a real host), so an
    # unqualified `3001:3001` here is reachable from the public internet the moment a security
    # group allows it, with no OS-level firewall as a second layer. Override API_PORT_BIND to
    # open it deliberately.
    ports: ['${API_PORT_BIND:-127.0.0.1}:3001:3001']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  worker:
    <<: [*api-image, *logging]
    environment: *api-env
    volumes: ['objectstorage:/app/var']
    command: ['node', 'dist/worker.js']
    # the worker has no HTTP surface; replace the API image's /health/ready probe with a
    # check on its real dependency — the Redis it drains the outbox / runs housekeeping through.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "new (require('ioredis'))(process.env.REDIS_URL).ping().then(()=>process.exit(0),()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  # Customer-facing site (DEC-023) — Next.js App Router, /[locale]/… , full SEO. Internal;
  # reached through `edge`.
  site:
    build:
      context: .
      dockerfile: deploy/Dockerfile.site
      target: runtime
    image: carrental-site:${TAG:-local}
    environment:
      NODE_ENV: production
      API_UPSTREAM: http://api:3001
      SITE_URL: ${SITE_URL:-http://localhost:3000}
    expose: ['3000']
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
    <<: *logging

  # Operations & Admin dashboard (Vite SPA on nginx, served at /ops/). Internal; reached
  # through `edge`.
  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
      target: runtime
    image: carrental-web:${TAG:-local}
    environment:
      API_UPSTREAM: http://api:3001
    expose: ['8080']
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
    <<: *logging

  # Single edge/origin (STAGE-011): / → site, /ops → web, /api + /health → api. Keeps the
  # SameSite=Lax refresh cookie (DEC-021) working across both surfaces. TLS terminates in
  # front of this in a real deployment.
  edge:
    image: nginx:1.27-alpine
    environment:
      SITE_UPSTREAM: http://site:3000
      WEB_UPSTREAM: http://web:8080
      API_UPSTREAM: http://api:3001
    volumes:
      - ./deploy/nginx.edge.conf:/etc/nginx/templates/default.conf.template:ro
    ports: ['${EDGE_PORT:-3000}:8080']
    depends_on:
      api: { condition: service_healthy }
      site: { condition: service_started }
      web: { condition: service_started }
    restart: unless-stopped
    <<: *logging

volumes:
  pgdata:
  redisdata:
  objectstorage:
